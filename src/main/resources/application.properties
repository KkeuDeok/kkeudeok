spring.application.name=kkeudeok

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Docker off (do not auto-run compose.yaml)
spring.docker.compose.enabled=false

# Static cache: devtools sends Cache-Control: no-store by default,
# which re-downloads story-bg.png (548KB) + character PNGs on every page move.
# no-cache = store but revalidate -> 304 when unchanged.
spring.web.resources.cache.cachecontrol.no-cache=true

# MariaDB (VM)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://192.168.61.129:3306/kkeudeok
spring.datasource.username=kkeudeok
spring.datasource.password=1234

# DTO package -> lets XML write "UserDTO" instead of the full path
mybatis.type-aliases-package=kopo.kkeudeok.dto

# SQL (XML) location
mybatis.mapper-locations=classpath:mapper/*.xml

# DB column (login_id) <-> DTO field (loginId) auto-mapping.
# Without this every DTO value comes back null.
mybatis.configuration.map-underscore-to-camel-case=true

# Naver SMTP.
# Credentials come from environment variables - never write the real values here,
# this file is committed to git. Set MAIL_USERNAME / MAIL_PASSWORD outside the repo.
spring.mail.host=smtp.naver.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
