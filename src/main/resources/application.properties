spring.application.name=kkeudeok

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.docker.compose.enabled=false

spring.web.resources.cache.cachecontrol.no-cache=true

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://192.168.23.129:3306/kkeudeok
spring.datasource.username=kkeudeok
spring.datasource.password=${DB_PASSWORD:1234}

spring.sql.init.mode=never

mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=kopo.kkeudeok.dto
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

kkeudeok.gemini.api-key=${GEMINI_API_KEY:}
kkeudeok.gemini.model=gemini-3.6-flash
kkeudeok.gemini.temperature=0.9
kkeudeok.gemini.timeout-seconds=20

kkeudeok.story.daily-goal=3

kkeudeok.gemini.roadmap-timeout-seconds=90

# ⚠ 비밀값은 여기 적지 말 것 — 이 파일은 git 에 올라간다.
#   앱 비밀번호는 환경변수 MAIL_APP_PASSWORD 로 넣는다(없으면 메일 발송만 실패한다).
#   PowerShell:  $env:MAIL_APP_PASSWORD = "앱비밀번호"
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=2620110191@gspace.kopo.ac.kr
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
