spring.application.name=kkeudeok

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.docker.compose.enabled=false

spring.web.resources.cache.cachecontrol.no-cache=true

server.servlet.session.persistent=false

server.servlet.session.tracking-modes=cookie

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=kkeudeok
spring.datasource.password=${DB_PASSWORD}

spring.sql.init.mode=never

mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=kopo.kkeudeok.dto
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

kkeudeok.gemini.api-key=${AI_API}
kkeudeok.gemini.model=${AI_MODEL:gemini-3.5-flash-lite}
kkeudeok.gemini.roadmap-model=${AI_ROADMAP_MODEL:gemini-3.5-flash}
kkeudeok.gemini.temperature=0.9
kkeudeok.gemini.timeout-seconds=90

kkeudeok.story.daily-goal=3

kkeudeok.gemini.roadmap-timeout-seconds=150
kkeudeok.gemini.polish-nodes=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=2620110191@gspace.kopo.ac.kr
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
