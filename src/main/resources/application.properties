spring.application.name=kkeudeok

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Docker 미사용 (compose.yaml 자동 실행 끔)
spring.docker.compose.enabled=false

# 정적 파일 캐시 — devtools 가 기본으로 Cache-Control: no-store 를 박는다.
# 그러면 화면을 넘길 때마다 배경 story-bg.png 548KB + 캐릭터 PNG 를 통째로 다시 받아,
# 흰 화면이 먼저 뜨고 배경이 뒤늦게 들어온다("번쩍했다가 돌아오는" 느낌의 원인).
# no-cache = 저장은 하되 매번 확인 — 안 바뀌었으면 304(수백 바이트)로 끝난다.
# 파일을 고치면 그 즉시 새로 내려가므로 개발 편의는 그대로다.
spring.web.resources.cache.cachecontrol.no-cache=true

# DB 연결 없이 기동 — 아직 Mapper/Service가 없어 DataSource가 필요 없다.
# 백엔드에서 DB를 붙일 때 이 줄을 지우고 spring.datasource.* 를 설정할 것.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
