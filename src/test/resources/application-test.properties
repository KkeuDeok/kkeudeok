# 테스트 프로필 — @ActiveProfiles("test") 를 붙인 테스트에서만 적용된다.
#
# ⚠ 왜 application.properties 가 아니라 프로필인가
#   src/test/resources/application.properties 를 만들면 src/main 쪽 같은 이름 파일이
#   **통째로 가려진다**. mybatis.mapper-locations 까지 같이 사라져서 매퍼를 못 찾는다
#   (실제로 그렇게 깨졌다). 프로필로 두면 main 설정이 그대로 살아 있고 여기 적은 것만 덮인다.
#
# 하는 일 두 가지.
#   1. MariaDB 대신 인메모리 DB — 테스트를 돌리려고 도커를 띄우게 만들지 않는다
#   2. 스키마 자동 실행 끔 — db/schema.sql 은 MariaDB 전용 문법이라 H2 에서 안 돈다
#      (매퍼 테스트는 db/schema-h2.sql 을 @Sql 로 직접 넣는다)

spring.datasource.driver-class-name=org.h2.Driver
# MODE=MySQL 이 있어야 매퍼의 ON DUPLICATE KEY UPDATE 가 돈다.
# 이게 없으면 H2 가 문법 오류로 뱉는다 — MariaDB 에서는 멀쩡한 SQL 이다.
spring.datasource.url=jdbc:h2:mem:kkeudeok;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=never

# 테스트에서는 AI 를 부르지 않는다. 키가 비어 있으면 내장 시나리오로 흐른다.
kkeudeok.gemini.api-key=
